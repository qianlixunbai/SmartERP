name: SmartERP Stabilization Tests

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v4.0.1-stabilization
    paths:
      - ".github/workflows/stabilization-tests.yml"
      - "backend/**"

permissions:
  contents: read

concurrency:
  group: stabilization-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Run isolated regression tests
        working-directory: backend
        run: |
          ./mvnw -B -ntp \
            -Dtest=JwtPropertiesValidationTest,ApprovalAuthorizationServiceTest,LeaveControllerObjectAuthorizationTest,ExpenseControllerObjectAuthorizationTest,LeaveServiceApprovalActionTest,ExpenseServiceApprovalActionTest,LeaveControllerRepairPermissionTest,LeaveServiceRejectionCleanupTest,ExpenseServiceRejectionCleanupTest,GlobalExceptionHandlerHttpStatusTest,JwtFilterHttpResponseTest,ControllerHttpStatusTest,PortfolioControllerAuthorizationTest,ApprovalConditionEvaluatorTest,ApprovalConditionServiceIntegrationTest,RequestValidationHttpTest,RequestDtoValidationTest,PortfolioServiceAssetPriceTest,ControllerMethodValidationHttpTest,SafeAttachmentUrlValidatorTest,TemplateServiceDraftLifecycleTest \
            test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-regression-surefire
          path: backend/target/surefire-reports/**

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Verify Docker environment
        run: |
          docker version
          docker info

      - name: Run Testcontainers MySQL integration tests
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=StabilizationMapperIntegrationTest,TemplateVersionSchemaMigrationIntegrationTest,TemplateServiceConcurrencyIntegrationTest test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-surefire
          path: backend/target/surefire-reports/**

# Full legacy SpringBootTest migration is tracked separately.
# This workflow intentionally runs the isolated regression suite and
# the new Testcontainers mapper integration suite.
