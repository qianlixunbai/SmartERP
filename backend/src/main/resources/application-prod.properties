# ============================================
# SmartERP — Production Profile
# ============================================
# ALL sensitive values MUST be provided via environment variables.
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ============================================

# MySQL — required environment variables
spring.datasource.url=${SMARTERP_DB_URL}
spring.datasource.username=${SMARTERP_DB_USERNAME}
spring.datasource.password=${SMARTERP_DB_PASSWORD}

# JWT — required environment variables
jwt.secret=${SMARTERP_JWT_SECRET}
jwt.expiration=${SMARTERP_JWT_EXPIRATION:86400000}
