# ============================================
# SmartERP — Development Profile
# ============================================
# This file provides safe defaults for local development.
# Override any value via environment variables.
# WARNING: Never commit personal database credentials here.
# ============================================

# MySQL — local development (override via env vars for your machine)
spring.datasource.url=${SMARTERP_DB_URL:jdbc:mysql://localhost:3306/smarterp?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8}
spring.datasource.username=${SMARTERP_DB_USERNAME:root}
spring.datasource.password=${SMARTERP_DB_PASSWORD:}

# MyBatis SQL stdout logging — enabled in dev for debugging
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT — MUST be provided via environment variable (no fallback)
jwt.secret=${SMARTERP_JWT_SECRET}
jwt.expiration=${SMARTERP_JWT_EXPIRATION:86400000}
