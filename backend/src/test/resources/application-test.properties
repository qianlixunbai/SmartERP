# ============================================
# SmartERP — Test Profile (Testcontainers)
# ============================================
# Datasource is provided dynamically by Testcontainers.
# This file only contains non-datasource configuration.
# ============================================

jwt.secret=SmartERP-TestOnly-Secret-Key-At-Least-32-Characters
jwt.expiration=86400000

mybatis-plus.configuration.map-underscore-to-camel-case=true

# Do not run any schema/data SQL on startup; tests manage their own data
spring.sql.init.mode=never
